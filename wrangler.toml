name = "contextds-api"
main = "workers/api/src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "contextds"
database_id = "local-contextds-db"
migrations_dir = "lib/db/migrations/d1"

[dev]
port = 8787
