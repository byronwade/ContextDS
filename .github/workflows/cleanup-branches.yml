name: Cleanup merged branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete fully merged alias branches
        run: |
          git push origin --delete claude/details-page-redesign-yuwb7m || echo "claude branch already gone"
          git push origin --delete cursor/unify-secondary-app-shell-64c0 || echo "cursor branch already gone"
